name: Deploy Desa (manual)

on:
  workflow_dispatch:

permissions: {}

jobs:
  build_and_deploy_desa:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Flutter
        uses: subosito/flutter-action@f2c4f6686ca8e8d6e6d0f28410eeef506ed66aff # v2.18.0
        with:
          channel: "stable"
          cache: true

      - name: Check desa secrets
        env:
          WEB_KEY: ${{ secrets.FIREBASE_API_KEY_WEB_DESA }}
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PUELO_DESA }}
        run: |
          if [ -z "$WEB_KEY" ]; then echo "Falta FIREBASE_API_KEY_WEB_DESA"; exit 1; fi
          if [ -z "$SA" ]; then echo "Falta FIREBASE_SERVICE_ACCOUNT_PUELO_DESA"; exit 1; fi
          echo "Secrets desa presentes"

      - name: Build Web App (desa)
        env:
          FIREBASE_API_KEY_WEB: ${{ secrets.FIREBASE_API_KEY_WEB_DESA }}
          FIREBASE_API_KEY_ANDROID: ${{ secrets.FIREBASE_API_KEY_ANDROID }}
        run: |
          flutter pub get
          flutter build web --release \
            --dart-define=PUELLO_ENV=desa \
            --dart-define=FIREBASE_API_KEY_WEB="$FIREBASE_API_KEY_WEB" \
            --dart-define=FIREBASE_API_KEY_ANDROID="${FIREBASE_API_KEY_ANDROID:-}"

      - name: Copy Academia + brand
        run: |
          set -e
          mkdir -p build/web/content
          if [ -d content/academia ]; then cp -a content/academia build/web/content/; fi
          if [ -d content/brand ]; then cp -a content/brand build/web/content/; fi

      - name: Deploy Hosting + rules a puelo-desa
        uses: w9jds/firebase-action@5b73b1274a2229c7598af09e6e95addfb75f897b
        with:
          args: deploy --only hosting,firestore:rules,storage --project puelo-desa
        env:
          GCP_SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PUELO_DESA }}
