name: apply-buscador-57
on:
  push:
    paths:
      - '.github/workflows/apply-buscador-57.yml'
      - 'tools/apply_buscador_57.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch buscador 5.7
        run: python3 tools/apply_buscador_57.py
      - name: Commit and cleanup
        run: |
          rm -f .github/workflows/apply-buscador-57.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/buscadorPrestadores.dart tools/apply_buscador_57.py
          git add -u .github/workflows/apply-buscador-57.yml || true
          if git diff --cached --quiet; then
            echo no changes
            exit 0
          fi
          git commit -m "feat(buscador): 5.7 foto, chip Cerca y empty state con salida"
          git push
