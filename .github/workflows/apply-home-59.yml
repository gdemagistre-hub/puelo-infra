name: apply-home-59
on:
  push:
    paths:
      - '.github/workflows/apply-home-59.yml'
      - 'tools/apply_home_59.py'
      - 'lib/contacto/contactos_prestador_card.dart'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Homepage 5.9
        run: python3 tools/apply_home_59.py
      - name: Commit and cleanup
        run: |
          rm -f .github/workflows/apply-home-59.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/Homepage.dart lib/contacto/contactos_prestador_card.dart lib/contacto_service.dart tools/apply_home_59.py
          git add -u .github/workflows/apply-home-59.yml || true
          if git diff --cached --quiet; then
            echo no changes
            exit 0
          fi
          git commit -m "feat(home): 5.9 wire Te contactaron on prestador Home"
          git push
