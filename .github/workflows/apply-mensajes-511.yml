name: apply-mensajes-511
on:
  push:
    paths:
      - '.github/workflows/apply-mensajes-511.yml'
      - 'tools/apply_mensajes_511.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch mensajes 5.11
        run: python3 tools/apply_mensajes_511.py
      - name: Commit and cleanup
        run: |
          rm -f .github/workflows/apply-mensajes-511.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/mensajes/mensajes_list.dart lib/mensajes/mensajes_detalle.dart tools/apply_mensajes_511.py
          git add -u .github/workflows/apply-mensajes-511.yml || true
          if git diff --cached --quiet; then echo no changes; exit 0; fi
          git commit -m "feat(mensajes): 5.11 confirmar pago visible"
          git push
