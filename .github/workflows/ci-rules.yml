name: CI Firestore Rules

# Qué hace: corre firestore.rules en el emulador. No despliega.
# El deploy de rules corre el mismo test antes de publicar.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "firestore.rules"
      - "rules-tests/**"
      - ".github/workflows/ci-rules.yml"

permissions: {}

jobs:
  rules:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Solo main
        run: test "${GITHUB_REF}" = "refs/heads/main"

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: rules-tests/package-lock.json

      - name: Install rules tests
        working-directory: rules-tests
        run: npm ci --ignore-scripts

      - name: Test firestore rules
        working-directory: rules-tests
        run: npm test
