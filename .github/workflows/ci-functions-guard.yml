name: CI Functions Guard

# Qué hace: carga functions/index.js y falla si falta un export crítico
# o si el entrypoint quedó truncado. No despliega.
# El deploy de Functions corre el mismo chequeo antes de publicar.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "functions/**"
      - ".github/workflows/ci-functions-guard.yml"

permissions: {}

jobs:
  guard:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Solo main
        run: test "${GITHUB_REF}" = "refs/heads/main"

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install deps
        working-directory: functions
        run: npm ci --ignore-scripts

      - name: Syntax and required exports
        working-directory: functions
        env:
          GCLOUD_PROJECT: lifewalletpuelo
          GOOGLE_CLOUD_PROJECT: lifewalletpuelo
        run: node check_exports.js
