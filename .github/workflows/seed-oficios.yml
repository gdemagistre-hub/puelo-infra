name: Seed catálogo oficios

on:
  workflow_dispatch:

jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install admin SDK
        working-directory: functions
        run: npm install --omit=dev
      - name: Service account
        env:
          SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_LIFEWALLETPUELO }}
        run: |
          echo "$SA_JSON" > "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"
          echo "GCLOUD_PROJECT=lifewalletpuelo" >> "$GITHUB_ENV"
          echo "GOOGLE_CLOUD_PROJECT=lifewalletpuelo" >> "$GITHUB_ENV"
      - name: Seed cat_oficios
        run: node functions/seed_oficios.js
