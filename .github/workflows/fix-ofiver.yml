name: Fix ofiver typo
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fix-ofiver.yml'
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Replace ofiver with Sliver
        run: |
          if grep -q ofiver lib/tarjetaDigital.dart 2>/dev/null; then
            sed -i 's/ofiver/Sliver/g' lib/tarjetaDigital.dart
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add lib/tarjetaDigital.dart
            git commit -m "fix(tarjeta): ofiver→Sliver via CI"
            git push
          else
            echo "No ofiver found — nothing to fix"
          fi
