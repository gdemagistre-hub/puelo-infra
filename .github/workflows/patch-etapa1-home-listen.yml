name: Patch Etapa1 Home profileRevision

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/patch-etapa1-home-listen.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch files
        run: python3 scripts/patch_etapa1_profile.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add lib/Homepage.dart lib/mensajes/mensajes_detalle.dart
          if git diff --staged --quiet; then
            echo No changes
          else
            git commit -m "Etapa 1: Home escucha profileRevision; estrellas al aceptar eval"
            git push
          fi
