name: patch-elige-atajos
on:
  workflow_dispatch:
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch EligeOficio shortcuts
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('lib/elige_oficio.dart')
          t = p.read_text()
          old = "    {'id': 'cerrajeria', 'label': 'Cerrajer\u00eda', 'icon': Icons.lock_rounded, 'color': Color(0xFF475569)},\n  ];"
          new = """    {'id': 'cerrajeria', 'label': 'Cerrajer\u00eda', 'icon': Icons.lock_rounded, 'color': Color(0xFF475569)},\n    {'id': 'peluqueria', 'label': 'Peluquer\u00eda', 'icon': Icons.content_cut_rounded, 'color': Color(0xFFDB2777)},\n    {'id': 'lavado_auto', 'label': 'Lavado auto', 'icon': Icons.local_car_wash_rounded, 'color': Color(0xFF0369A1)},\n    {'id': 'personal_trainer', 'label': 'Trainer', 'icon': Icons.fitness_center_rounded, 'color': Color(0xFF15803D)},\n    {'id': 'ninera', 'label': 'Ni\u00f1era', 'icon': Icons.child_care_rounded, 'color': Color(0xFF7C3AED)},\n  ];"""
          if old not in t:
              raise SystemExit('atajos block not found')
          t = t.replace(old, new, 1)
          t = t.replace("hintText: 'Ej: plomer\u00eda, cer\u00e1micos, mudanzas\u2026',", "hintText: 'Ej: peluquer\u00eda, lavado de auto, trainer\u2026',", 1)
          p.write_text(t)
          print('ok')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/elige_oficio.dart
          git commit -m "EligeOficio: atajos peluquer\u00eda, lavado auto, trainer, ni\u00f1era."
          git push origin HEAD:main
