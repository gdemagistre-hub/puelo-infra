name: Restore Homepage Full + Badge
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/restore-homepage-full.yml'
      - 'tools/homepage_restore/apply_badge_patch.py'

jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore full Homepage + apply badge
        run: |
          set -e
          git show 7a514f973fad6c1d0579e987098ca865273d5204:lib/Homepage.dart > lib/Homepage.dart
          python3 tools/homepage_restore/apply_badge_patch.py
          wc -c lib/Homepage.dart
          grep -c _mensajesNavItem lib/Homepage.dart
          grep -c _buildClienteHome lib/Homepage.dart

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add lib/Homepage.dart
          git status
          git commit -m "RESTORE Homepage completo + badge pendientes (from 7a514f97 + patch)" || echo "No changes"
          git push origin HEAD:main
