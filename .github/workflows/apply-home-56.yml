name: apply-home-56
on:
  workflow_dispatch:
  push:
    paths:
      - 'tooling/apply_home_56.py'
      - '.github/workflows/apply-home-56.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply 5.6 patch
        run: python3 tooling/apply_home_56.py
      - name: Commit result and remove one-shot
        run: |
          rm -f .github/workflows/apply-home-56.yml
          rm -f tooling/apply_home_56.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A lib/Homepage.dart lib/registroTrabajador.dart
          git add -u .github/workflows/apply-home-56.yml tooling/apply_home_56.py || true
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "feat(home): 5.6 remember Busco/Ofrezco across sessions"
          git push origin HEAD:main
