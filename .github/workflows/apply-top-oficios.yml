name: apply-top-oficios
on:
  push:
    paths:
      - '.github/workflows/apply-top-oficios.yml'
      - 'tools/apply_top_oficios.py'
      - 'lib/demanda/demanda_oficios_service.dart'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch top oficios
        run: python3 tools/apply_top_oficios.py
      - name: Commit and cleanup
        run: |
          rm -f .github/workflows/apply-top-oficios.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/Homepage.dart lib/buscadorPrestadores.dart lib/demanda/demanda_oficios_service.dart firestore.rules functions/index.js functions/scoringCore.js tools/apply_top_oficios.py
          git add -u .github/workflows/apply-top-oficios.yml || true
          if git diff --cached --quiet; then echo no changes; exit 0; fi
          git commit -m "feat(home): top 8 oficios ayer con fallback canonico"
          git push
