name: Restore Homepage tips
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 5
      - name: Wire tip onTap to session gray
        run: |
          python3 scripts/patch_homepage_tips_ontap.py
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add lib/Homepage.dart
          git diff --cached --stat
          git commit -m "fix(home): tips onTap -> _ejecutarTip (gris sesion)" || echo "no changes"
          git push
