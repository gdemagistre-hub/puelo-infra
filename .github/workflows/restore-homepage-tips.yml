name: Restore Homepage tips
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Gray visited tips UI
        run: |
          python3 scripts/patch_homepage_tips_gray.py
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add lib/Homepage.dart
          git commit -m "feat(home): tips Confianza grises al volver en la sesion" || echo no-changes
          git push
