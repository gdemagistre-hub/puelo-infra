name: Apply Sprint 4 patches

on:
  workflow_dispatch:
  push:
    branches:
      - sprint4/sync-perfiles-responsive
    paths:
      - 'scripts/patches/sprint4_wire_listsync.sh'
      - '.github/workflows/apply-sprint4-patches.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: sprint4/sync-perfiles-responsive
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply patches
        run: bash scripts/patches/sprint4_wire_listsync.sh

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/Domicilioflotante.dart lib/completar_perfil.dart lib/datosPersonalesflotante.dart lib/capacitacionesflotante.dart
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Sprint 4: wire UsuarioListSync + camera guards in perfiles"
            git push origin sprint4/sync-perfiles-responsive
          fi
