name: Fix datos copy
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fix-datos-copy.yml'
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Patch and push
        run: |
          set -e
          echo "before:"
          grep -n "profesional\|Tus datos" lib/datosPersonalesflotante.dart || true
          python3 -c "
          from pathlib import Path
          p=Path('lib/datosPersonalesflotante.dart')
          c=p.read_text(encoding='utf-8')
          print('len', len(c))
          print('idx', c.find('perfil'))
          c2=c.replace('Tu perfil profesional','Tus datos para trabajar')
          print('changed', c2!=c)
          p.write_text(c2, encoding='utf-8')
          "
          echo "after:"
          grep -n "profesional\|Tus datos" lib/datosPersonalesflotante.dart || true
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add lib/datosPersonalesflotante.dart
          if git diff --cached --quiet; then
            echo "no file change"
            exit 0
          fi
          git commit -m "copy: Tus datos para trabajar (sin profesional)"
          git push origin HEAD:main
