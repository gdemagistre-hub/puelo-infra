name: Fix datos copy
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fix-datos-copy.yml'
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -e
          python3 << 'PY'
          from pathlib import Path
          p = Path('lib/datosPersonalesflotante.dart')
          c = p.read_text()
          c2 = c.replace('Tu perfil profesional', 'Tus datos para trabajar')
          if c2 == c:
              raise SystemExit('string not found')
          p.write_text(c2)
          assert 'profesional' not in c2.lower()
          print('ok', len(c2))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add lib/datosPersonalesflotante.dart
          git commit -m "copy: Tus datos para trabajar (sin profesional)"
          git push origin HEAD:main
