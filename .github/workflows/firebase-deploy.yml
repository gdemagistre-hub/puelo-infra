name: Deploy to Firebase Hosting
on:
  push:
    branches:
      - main

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Build Web App
        run: |
          flutter pub get
          flutter build web --release --dart-define=PUELLO_ENV=prod

      # Copia MP3 públicos desde Hosting de Finanzas (sin git clone / sin auth).
      # Así PROX también sirve /content/academia/audio/ cuando apaguemos finanzas.
      - name: Fetch Academia audio (HTTP)
        run: |
          set -e
          mkdir -p build/web/content/academia/audio
          BASE="https://puelo-finanzas.web.app/content/academia"
          for id in ahorro_inflacion separar_plata presupuesto_obra herramientas gastos_escondidos cobrar_bien cuidado_con_prestamos; do
            echo "Fetching $id.mp3"
            curl -fsSL "$BASE/audio/$id.mp3" -o "build/web/content/academia/audio/$id.mp3" \
              || echo "WARN: skip $id"
          done
          curl -fsSL "$BASE/catalogo.json" -o build/web/content/academia/catalogo.json || true
          echo "=== audio files ==="
          ls -la build/web/content/academia/audio/ || true

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_LIFEWALLETPUELO }}'
          projectId: lifewalletpuelo
          channelId: live
