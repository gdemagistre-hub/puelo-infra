name: Deploy to Firebase Hosting
on:
  push:
    branches:
      - main

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Build Web App
        run: |
          flutter pub get
          flutter build web --release --dart-define=PUELLO_ENV=prod

      - name: Copy Academia content (audios) from puelo-finanzas
        run: |
          set -e
          mkdir -p build/web/content/academia
          git clone --depth 1 https://github.com/gdemagistre-hub/puelo-finanzas.git /tmp/puelo-finanzas
          cp -a /tmp/puelo-finanzas/content/academia/. build/web/content/academia/
          if [ -d content/academia ]; then
            cp -a content/academia/. build/web/content/academia/
          fi
          echo "=== content/academia ==="
          find build/web/content/academia -type f | head -40

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_LIFEWALLETPUELO }}'
          projectId: lifewalletpuelo
          channelId: live
