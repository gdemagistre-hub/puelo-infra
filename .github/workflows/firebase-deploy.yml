name: Deploy to Firebase Hosting
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Build Web App
        run: |
          flutter pub get
          flutter build web --release --dart-define=PUELLO_ENV=prod

      # Copia content/academia (MP3 + lo que haya) desde el propio repo.
      # Self-contained: no depende de puelo-finanzas ni de curl externo.
      - name: Copy Academia content
        run: |
          set -e
          mkdir -p build/web/content
          if [ -d content/academia ]; then
            cp -a content/academia build/web/content/
            echo "=== content/academia copiado ==="
            ls -la build/web/content/academia/ || true
            echo "=== audio files ==="
            ls -la build/web/content/academia/audio/ || true
          else
            echo "WARN: content/academia no encontrado en el repo"
          fi

      # Firma sonora PROX (open + confirm).
      - name: Copy brand sounds
        run: |
          set -e
          mkdir -p build/web/content
          if [ -d content/brand ]; then
            cp -a content/brand build/web/content/
            echo "=== content/brand copiado ==="
            ls -la build/web/content/brand/ || true
          else
            echo "WARN: content/brand no encontrado en el repo"
          fi

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_LIFEWALLETPUELO }}'
          projectId: lifewalletpuelo
          channelId: live
