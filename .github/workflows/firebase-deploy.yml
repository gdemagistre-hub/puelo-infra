name: Deploy to Firebase Hosting
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {}

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - name: Solo main
        run: test "${GITHUB_REF}" = "refs/heads/main"

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Flutter
        uses: subosito/flutter-action@f2c4f6686ca8e8d6e6d0f28410eeef506ed66aff # v2.18.0
        with:
          channel: 'stable'
          cache: true

      - name: Check Firebase API key secrets
        env:
          WEB_KEY: ${{ secrets.FIREBASE_API_KEY_WEB }}
          ANDROID_KEY: ${{ secrets.FIREBASE_API_KEY_ANDROID }}
        run: |
          if [ -z "$WEB_KEY" ]; then
            echo "Falta secret FIREBASE_API_KEY_WEB"
            exit 1
          fi
          if [ -z "$ANDROID_KEY" ]; then
            echo "Falta secret FIREBASE_API_KEY_ANDROID"
            exit 1
          fi
          echo "Secrets de API key presentes (no se imprimen)"

      - name: Build Web App
        env:
          FIREBASE_API_KEY_WEB: ${{ secrets.FIREBASE_API_KEY_WEB }}
          FIREBASE_API_KEY_ANDROID: ${{ secrets.FIREBASE_API_KEY_ANDROID }}
        run: |
          flutter pub get
          flutter build web --release \
            --dart-define=PUELLO_ENV=prod \
            --dart-define=FIREBASE_API_KEY_WEB="$FIREBASE_API_KEY_WEB" \
            --dart-define=FIREBASE_API_KEY_ANDROID="$FIREBASE_API_KEY_ANDROID"

      - name: Copy Academia content
        run: |
          set -e
          mkdir -p build/web/content
          if [ -d content/academia ]; then
            cp -a content/academia build/web/content/
            echo "=== content/academia copiado ==="
            ls -la build/web/content/academia/ || true
            echo "=== audio files ==="
            ls -la build/web/content/academia/audio/ || true
          else
            echo "WARN: content/academia no encontrado en el repo"
          fi

      - name: Copy brand sounds
        run: |
          set -e
          mkdir -p build/web/content
          if [ -d content/brand ]; then
            cp -a content/brand build/web/content/
            echo "=== content/brand copiado ==="
            ls -la build/web/content/brand/ || true
          else
            echo "WARN: content/brand no encontrado en el repo"
          fi

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@73212fc153444869d3e433816aab02624792fcef # v0.10.0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_LIFEWALLETPUELO }}'
          projectId: lifewalletpuelo
          channelId: live
