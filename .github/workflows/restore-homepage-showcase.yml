name: restore-homepage-showcase
on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/homepage_showcase_b64_*.txt'
      - 'tools/restore_homepage_showcase.sh'
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Restore Homepage.dart
        run: bash tools/restore_homepage_showcase.sh
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add lib/Homepage.dart
          git diff --cached --quiet || git commit -m "fix(home): restore Homepage from showcase b64 chunks"
          git push
