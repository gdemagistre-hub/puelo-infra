name: Copy sin profesional
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/copy-sin-profesional.yml'

jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Replace formal copy
        run: |
          set -e
          python3 << 'PY'
          from pathlib import Path

          # Homepage
          hp = Path('lib/Homepage.dart')
          c = hp.read_text()
          old = "_buildBrandHeader(subtitle: 'Tu perfil profesional en Puelo')"
          new = "_buildBrandHeader(subtitle: 'Así te ven quienes buscan trabajo')"
          if old not in c:
              raise SystemExit('Homepage string not found')
          c = c.replace(old, new)
          if 'profesional' in c.lower():
              # leave other uses if any; only fail if still the old phrase
              pass
          hp.write_text(c)
          print('Homepage OK')

          # elige_camino (idempotent)
          ec = Path('lib/elige_camino.dart')
          if ec.exists():
              t = ec.read_text()
              t2 = t.replace("titulo: 'Busco un profesional'", "titulo: 'Necesito un trabajo'")
              t2 = t2.replace(
                  "subtitulo: 'Necesito que alguien haga un trabajo'",
                  "subtitulo: 'Busco a alguien de confianza'",
              )
              if t2 != t:
                  ec.write_text(t2)
                  print('elige_camino OK')
              else:
                  print('elige_camino already updated or pattern mismatch')
                  # show nearby lines
                  for i, line in enumerate(t.splitlines(), 1):
                      if 'Busco' in line or 'profesional' in line.lower():
                          print(i, line)
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add lib/Homepage.dart lib/elige_camino.dart
          git status
          git commit -m "copy: sin profesional — lenguaje de oficio/barrio" || echo no changes
          git push origin HEAD:main
