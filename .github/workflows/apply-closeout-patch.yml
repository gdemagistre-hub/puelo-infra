name: Apply closeout patch
on:
  workflow_dispatch:
  push:
    branches: [chore/us-east1-secrets-listsync]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/us-east1-secrets-listsync
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply patches
        run: |
          set -e
          git apply scripts/patches/sprint0_closeout_us_east1_listsync.patch || true
          git apply scripts/patches/sprint5_completar_datos.patch || true
          sed -i 's/southamerica-east1/us-east1/g' functions/index.js lib/loginScreen.dart lib/pantalla_gracias_validacion.dart lib/validar_domicilio.dart 2>/dev/null || true
          python3 - <<'PY'
          from pathlib import Path
          p = Path('functions/index.js')
          t = p.read_text()
          t = t.replace('// Si el secret existe en el proyecto, bindearlo:\n    // secrets: ["BATCH_SECRET"],', 'secrets: ["BATCH_SECRET"],')
          t = t.replace('// secrets: ["BATCH_SECRET"],', 'secrets: ["BATCH_SECRET"],')
          if 'secrets: ["DEV_LOGIN_SECRET"]' not in t:
              t = t.replace(
                  'timeoutSeconds: 30,\n  },\n  async (req, res) => {\n    applyCors(req, res);\n    if (req.method === "OPTIONS") {\n      res.status(204).send("");\n      return;\n    }\n    if (req.method !== "POST") {\n      res.status(405).json({ error: "method_not_allowed" });',
                  'timeoutSeconds: 30,\n    secrets: ["DEV_LOGIN_SECRET"],\n  },\n  async (req, res) => {\n    applyCors(req, res);\n    if (req.method === "OPTIONS") {\n      res.status(204).send("");\n      return;\n    }\n    if (req.method !== "POST") {\n      res.status(405).json({ error: "method_not_allowed" });'
              )
          p.write_text(t)
          print('region', 'us-east1' in t)
          print('batch', 'secrets: ["BATCH_SECRET"]' in t)
          print('dev', 'secrets: ["DEV_LOGIN_SECRET"]' in t)
          PY
          grep -n 'region:\|secrets:\|us-east1' functions/index.js | head -20 || true
          grep -c UsuarioListSync lib/completar_perfil.dart lib/datosPersonalesflotante.dart || true
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then echo "no changes"; else git commit -m "apply: us-east1 + secrets + listsync" && git push; fi
