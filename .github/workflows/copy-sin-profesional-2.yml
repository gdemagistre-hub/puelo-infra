name: Copy sin profesional 2
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/copy-sin-profesional-2.yml'

jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Replace remaining profesional copy
        run: |
          set -e
          python3 << 'PY'
          from pathlib import Path

          reps = [
            (
              Path('lib/datosPersonalesflotante.dart'),
              "_esPrestador ? 'Tu perfil profesional' : 'Tu identidad en Puelo'",
              "_esPrestador ? 'Tus datos para trabajar' : 'Tu identidad en Puelo'",
            ),
            (
              Path('lib/calificarTrabajo.dart'),
              "'El comentario lo ve el profesional. Las estrellas sí son públicas.",
              "'El comentario lo ve quien hizo el trabajo. Las estrellas sí son públicas.",
            ),
            (
              Path('lib/menuEvaluaciones.dart'),
              "titulo: 'Calificar al profesional'",
              "titulo: 'Calificar el trabajo'",
            ),
            (
              Path('lib/Homepage.dart'),
              "_buildBrandHeader(subtitle: 'Tu perfil profesional en Puelo')",
              "_buildBrandHeader(subtitle: 'Así te ven quienes buscan trabajo')",
            ),
          ]

          changed = []
          for path, old, new in reps:
              if not path.exists():
                  print('missing', path)
                  continue
              c = path.read_text()
              if old in c:
                  path.write_text(c.replace(old, new))
                  changed.append(str(path))
                  print('patched', path)
              elif new.split("'")[1] in c or (len(new.split("'"))>3 and new.split("'")[3] in c):
                  print('already ok', path)
              else:
                  # soft: show hits
                  hits = [ln for ln in c.splitlines() if 'profesional' in ln.lower()]
                  print('NO MATCH', path, hits[:3])

          # final scan
          left = []
          for p in Path('lib').rglob('*.dart'):
              t = p.read_text()
              if 'profesional' in t.lower():
                  for ln in t.splitlines():
                      if 'profesional' in ln.lower():
                          left.append(f'{p}:{ln.strip()[:80]}')
          print('REMAINING', left)
          if not changed and not left:
              print('nothing')
          PY
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add lib/datosPersonalesflotante.dart lib/calificarTrabajo.dart lib/menuEvaluaciones.dart lib/Homepage.dart || true
          git commit -m "copy: sin profesional en datos/calificar/evaluar" || echo no changes
          git push origin HEAD:main
