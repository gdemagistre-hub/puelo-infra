name: Wire sendAuthEmail index
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/patch-etapa34-ionos-wire.yml"
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Append export if missing
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path("functions/index.js")
          t = p.read_text(encoding="utf-8")
          if "auth_emails" in t and "sendAuthEmail" in t:
              print("already wired")
          else:
              block = """
// ---------------------------------------------------------------------------
// Auth emails (no-reply@puelo.app vía SMTP IONOS)
// ---------------------------------------------------------------------------
const authEmails = require("./auth_emails");
exports.sendAuthEmail = authEmails.sendAuthEmail;
"""
              p.write_text(t.rstrip() + "\n" + block, encoding="utf-8")
              print("wired")
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add functions/index.js
          if git diff --cached --quiet; then echo No changes; else
            git pull --rebase origin main || true
            git commit -m "etapa3.4: export sendAuthEmail en index.js"
            git push
          fi
