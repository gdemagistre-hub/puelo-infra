name: apply-home-512
on:
  push:
    paths:
      - '.github/workflows/apply-home-512.yml'
      - 'tools/apply_home_512.py'
      - 'lib/mensajes/confirmar_pago_home_card.dart'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Homepage 5.12
        run: python3 tools/apply_home_512.py
      - name: Commit and cleanup
        run: |
          rm -f .github/workflows/apply-home-512.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/Homepage.dart lib/mensajes/confirmar_pago_home_card.dart tools/apply_home_512.py
          git add -u .github/workflows/apply-home-512.yml || true
          if git diff --cached --quiet; then echo no changes; exit 0; fi
          git commit -m "feat(home): 5.12 card Confirmá un pago + contactos arriba"
          git push
