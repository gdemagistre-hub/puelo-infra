name: apply-home-54
on:
  push:
    paths:
      - '.github/workflows/apply-home-54.yml'
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 40
      - name: Apply 5.4 tips UX on restored Homepage
        run: |
          set -euo pipefail
          python3 scripts/apply_home_54.py
          grep -q 'SIGUIENTE PASO' lib/Homepage.dart
          rm -f .github/workflows/apply-home-54.yml scripts/apply_home_54.py scripts/home54_tips_snippet.dart
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(home): 5.4 prestador tips hierarchy (next step + muted checklist)"
          git push
