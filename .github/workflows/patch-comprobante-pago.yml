name: Patch comprobante de pago copy

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/patch-comprobante-pago.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Replace recibo copy
        run: |
          set -e
          python3 << 'PY'
          from pathlib import Path

          p = Path('lib/tarjetaDigital.dart')
          t = p.read_text()
          t = t.replace('Iniciá sesión con Google para emitir un recibo',
                        'Iniciá sesión con Google para registrar un pago')
          t = t.replace('No podés emitir un recibo a vos mismo',
                        'No podés registrar un pago a vos mismo')
          t = t.replace("'Emitir recibo'", "'Doy un pago'")
          p.write_text(t)
          print('tarjeta Doy', 'Doy un pago' in t)

          p = Path('lib/mensajes/mensajes_detalle.dart')
          t = p.read_text()
          pairs = [
            ("tooltip: 'Emitir recibo'", "tooltip: 'Doy un pago'"),
            ("label: const Text('Emitir recibo')", "label: const Text('Doy un pago')"),
            ("soyEmisor ? 'Vos emitiste' : 'Te emitieron'",
             "soyEmisor ? 'Registraste un pago' : 'Te registraron un pago'"),
            ("'Recibos, evaluaciones y mensajes quedan registrados. '",
             "'Comprobantes, evaluaciones y mensajes quedan registrados. '"),
            ("'Los recibos se sellan; las evaluaciones se publican al aceptar.'",
             "'Los comprobantes se sellan; las evaluaciones se publican al aceptar.'"),
            ("? 'Recibo aceptado", "? 'Comprobante aceptado"),
            (": 'Recibo rechazado", ": 'Comprobante rechazado"),
          ]
          for a,b in pairs:
              print(('ok' if a in t else 'miss'), a[:48])
              t = t.replace(a,b)
          t = t.replace(
              'o emití un recibo cuando haya un pago o seña.',
              'o registrá un pago cuando corresponda.',
          )
          p.write_text(t)

          p = Path('lib/mensajes/emitir_recibo_sheet.dart')
          t = p.read_text()
          sheet = [
            ("              'Emitir recibo',", "              'Doy un pago',"),
            ("        throw StateError('Elegí a quién emitir el recibo.');",
             "        throw StateError('Elegí a quién le pagaste.');"),
            ("                      'Registrar recibo',", "                      'Registrar comprobante',"),
            ("                  labelText: 'A quién',", "                  labelText: 'A quién le pagaste',"),
          ]
          for a,b in sheet:
              print(('ok' if a in t else 'miss'), a[:50])
              t = t.replace(a,b)
          t = t.replace("const Text(\n              'Emitir recibo',", "const Text(\n              'Doy un pago',")
          t = t.replace(
              'Quedará registrado una sola vez, con firma del contenido.',
              'Registrás un comprobante de pago. Quien lo recibe lo confirma.',
          )
          t = t.replace(
              'No se podrá editar ni borrar.',
              'No reemplaza factura. Queda sellado y no se puede editar.',
          )
          t = t.replace('Recibo emitido', 'Comprobante registrado')
          t = t.replace("'Para'", "'Le pagás a'")
          if "where('cliente_uid', isEqualTo: myUid)" not in t:
              mark = "      // 2) Contactos de la app"
              block = '''      // Prestadores que yo contacté (soy cliente)\n      try {\n        final yoCliente = await FirebaseFirestore.instance\n            .collection('contactos')\n            .where('cliente_uid', isEqualTo: myUid)\n            .limit(40)\n            .get();\n        for (final doc in yoCliente.docs) {\n          final data = doc.data();\n          final other = (data['prestador_uid'] ?? '').toString().trim();\n          if (other.isEmpty || other == myUid) continue;\n          if (seen.contains(other)) continue;\n          seen.add(other);\n          final hint = (data['prestador_nombre'] ?? '').toString().trim();\n          final nombre = hint.isNotEmpty\n              ? hint\n              : await MensajesService.instance.resolveDisplayName(other);\n          list.add(_Sugerencia(\n            uid: other,\n            nombre: nombre,\n            origen: 'contacto',\n          ));\n        }\n      } catch (e) {\n        debugPrint('EmitirReciboSheet contactos cliente: $e');\n      }\n\n'''
              if mark in t:
                  t = t.replace(mark, block + mark, 1)
                  print('inserted cliente query')
              else:
                  print('mark missing for cliente query')
          p.write_text(t)
          print('sheet Doy', 'Doy un pago' in t)
          PY
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add lib/tarjetaDigital.dart lib/mensajes/mensajes_detalle.dart lib/mensajes/emitir_recibo_sheet.dart
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "ux: Doy un pago / comprobante (cliente registra, prestador confirma)"
            git push
          fi
