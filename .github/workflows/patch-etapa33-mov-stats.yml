name: Patch etapa3.3 movimientos stats sync
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/patch-etapa33-mov-stats.yml"
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Always sync stats on add
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path("lib/mis_numeros/data/movimientos_store.dart")
          t = p.read_text(encoding="utf-8")
          old = """  Future<bool> add(Movimiento m) async {
    _items.insert(0, m);
    notifyListeners();
    await _persistLocal();
    try {
      await _cloudSetStrict(m);
      _cloudOk = true;
      lastCloudError = null;
      notifyListeners();
      unawaited(_syncStatsNegocio());
      return true;
    } catch (e) {
      debugPrint('MovimientosStore.add cloud fail: $e');
      await _enqueuePending(m);
      _cloudOk = false;
      lastCloudError = _friendlyError(e);
      notifyListeners();
      return false;
    }
  }"""
          new = """  Future<bool> add(Movimiento m) async {
    _items.insert(0, m);
    notifyListeners();
    await _persistLocal();
    # Conteos locales → stats_negocio (no depende del write del movimiento).
    unawaited(_syncStatsNegocio());
    try {
      await _cloudSetStrict(m);
      _cloudOk = true;
      lastCloudError = null;
      notifyListeners();
      return true;
    } catch (e) {
      debugPrint('MovimientosStore.add cloud fail: $e');
      await _enqueuePending(m);
      _cloudOk = false;
      lastCloudError = _friendlyError(e);
      notifyListeners();
      return false;
    }
  }"""
          # Fix: the comment in new must be Dart comment not python
          new = new.replace("# Conteos locales → stats_negocio (no depende del write del movimiento).", "// Conteos locales → stats_negocio (no depende del write del movimiento).")
          if old not in t:
              if "Conteos locales" in t:
                  print("ALREADY")
              else:
                  raise SystemExit("pattern not found")
          else:
              p.write_text(t.replace(old, new, 1), encoding="utf-8")
              print("PATCHED")
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add lib/mis_numeros/data/movimientos_store.dart
          if git diff --cached --quiet; then echo No changes; else
            git pull --rebase origin main || true
            git commit -m "etapa3.3: sync stats_negocio al agregar cobro aunque falle cloud"
            git push
          fi
