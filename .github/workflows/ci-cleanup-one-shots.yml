name: CI cleanup one-shot workflows
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/ci-cleanup-one-shots.yml"
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Delete obsolete one-shot workflows
        run: |
          set -e
          KEEP=(
            firebase-deploy.yml
            deploy-functions.yml
            deploy-rules-rest.yml
            deploy-firestore-indexes.yml
            deploy-storage-rules.yml
            ci-cleanup-one-shots.yml
          )
          cd .github/workflows
          for f in *.yml; do
            skip=0
            for k in "${KEEP[@]}"; do
              if [ "$f" = "$k" ]; then skip=1; break; fi
            done
            if [ $skip -eq 0 ]; then
              echo "DELETE $f"
              git rm -f "$f" || rm -f "$f"
            else
              echo "KEEP $f"
            fi
          done
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A .github/workflows || true
          if git diff --cached --quiet; then
            echo "Nothing left to delete"
          else
            git pull --rebase origin main || true
            git commit -m "chore(ci): remove obsolete one-shot patch/restore workflows"
            git push
          fi
