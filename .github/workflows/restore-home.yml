name: restore-home
on:
  push:
    paths:
      - '.github/workflows/restore-home.yml'
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 40
      - name: Restore lib/Homepage.dart and delete one-shot workflows
        run: |
          set -euo pipefail
          git checkout d9ff76bcbb0247d65b65ce8bc2e4a63d3e5093a9 -- lib/Homepage.dart
          test -s lib/Homepage.dart
          grep -q HomePageWidget lib/Homepage.dart
          rm -f .github/workflows/restore-home.yml .github/workflows/apply-home-54.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(home): restore Homepage from 5.3 after placeholder commit"
          git push
