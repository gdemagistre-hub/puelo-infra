name: Fix elige Sliver typo
on:
  push:
    paths:
      - ".github/workflows/fix-elige-typo.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix typo and improve registro
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('lib/elige_oficio.dart')
          t = p.read_text(encoding='utf-8')
          t2 = t.replace('Sli verGridDelegateWithFixedCrossAxisCount', 'SliverGridDelegateWithFixedCrossAxisCount')
          if t2 != t:
              p.write_text(t2, encoding='utf-8')
              print('elige fixed')
          else:
              print('elige already ok or pattern missing')
              if 'Sli ver' in t:
                  raise SystemExit('still broken')
          # registroTrabajador copy improvements
          r = Path('lib/registroTrabajador.dart')
          rt = r.read_text(encoding='utf-8')
          orig = rt
          rt = rt.replace("title: const Text('Mis servicios'),", "title: const Text('Ofrecer servicios'),", 1)
          rt = rt.replace(
              "'Estás a 3 pasos de recibir pedidos'",
              "'Configurá tu perfil en 3 pasos'",
              1,
          )
          old_sub = "Completá oficios, zona y compartí tu tarjeta por WhatsApp."
          new_sub = (
              "1) Qué oficios hacés · 2) Dónde trabajás · 3) Tu tarjeta para WhatsApp. "
              "Con oficios y zona los clientes te encuentran cerca."
          )
          rt = rt.replace(old_sub, new_sub, 1)
          rt = rt.replace("titulo: 'Especialidades',", "titulo: 'Tus oficios',", 1)
          rt = rt.replace("'Oficios cargados ✓'", "'Cargados ✓'", 1)
          # snackbars after pasos
          if 'Ahora definí tu zona' not in rt:
              rt = rt.replace(
                  '''  Future<void> _abrirPaso1() async {
    await Navigator.push(
      context,
      MaterialPageRoute(
        builder: (_) => const EspecialidadesLaboralesFlotanteWidget(),
      ),
    );
    await _refrescarEstado();
  }''',
                  '''  Future<void> _abrirPaso1() async {
    await Navigator.push(
      context,
      MaterialPageRoute(
        builder: (_) => const EspecialidadesLaboralesFlotanteWidget(),
      ),
    );
    await _refrescarEstado();
    if (!mounted) return;
    if (_paso1Ok && !_paso2Ok) {
      ScaffoldMessenger.of(context).showSnackBar(
        const SnackBar(
          content: Text('Listo. Ahora definí tu zona de trabajo.'),
          duration: Duration(seconds: 3),
        ),
      );
    }
  }''',
                  1,
              )
          if 'Ya podés ver y compartir' not in rt:
              rt = rt.replace(
                  '''    await Navigator.push(
      context,
      MaterialPageRoute(
        builder: (_) => const ZonaDeTrabajoFlotanteWidget(),
      ),
    );
    await _refrescarEstado();
  }''',
                  '''    await Navigator.push(
      context,
      MaterialPageRoute(
        builder: (_) => const ZonaDeTrabajoFlotanteWidget(),
      ),
    );
    await _refrescarEstado();
    if (!mounted) return;
    if (_paso1Ok && _paso2Ok) {
      ScaffoldMessenger.of(context).showSnackBar(
        const SnackBar(
          content: Text('Zona lista. Ya podés ver y compartir tu tarjeta.'),
          duration: Duration(seconds: 3),
        ),
      );
    }
  }''',
                  1,
              )
          if 'Ir al inicio' not in rt and "Ver y compartir mi tarjeta" in rt:
              rt = rt.replace(
                  '''                if (_paso1Ok && _paso2Ok)
                  SizedBox(
                    width: double.infinity,
                    height: 50,
                    child: ElevatedButton.icon(
                      onPressed: _abrirPaso3,
                      icon: const Icon(Icons.badge_outlined),
                      label: const Text('Ver y compartir mi tarjeta'),
                      style: ElevatedButton.styleFrom(
                        backgroundColor: _primary,
                        foregroundColor: Colors.white,
                        elevation: 0,
                        shape: RoundedRectangleBorder(
                          borderRadius: BorderRadius.circular(12),
                        ),
                      ),
                    ),
                  )
                else
                  Text(
                    'Tip: con oficios + zona los clientes pueden encontrarte en el buscador.',
                    style: TextStyle(
                      fontSize: 13,
                      color: Colors.grey.shade600,
                      height: 1.35,
                    ),
                  ),''',
                  '''                if (_paso1Ok && _paso2Ok) ...[
                  SizedBox(
                    width: double.infinity,
                    height: 50,
                    child: ElevatedButton.icon(
                      onPressed: _abrirPaso3,
                      icon: const Icon(Icons.badge_outlined),
                      label: const Text('Ver y compartir mi tarjeta'),
                      style: ElevatedButton.styleFrom(
                        backgroundColor: _primary,
                        foregroundColor: Colors.white,
                        elevation: 0,
                        shape: RoundedRectangleBorder(
                          borderRadius: BorderRadius.circular(12),
                        ),
                      ),
                    ),
                  ),
                  const SizedBox(height: 12),
                  SizedBox(
                    width: double.infinity,
                    height: 48,
                    child: OutlinedButton(
                      onPressed: () {
                        Navigator.pushAndRemoveUntil(
                          context,
                          MaterialPageRoute(
                            builder: (_) => const HomePageWidget(
                              initialModoPrestador: true,
                            ),
                          ),
                          (route) => false,
                        );
                      },
                      style: OutlinedButton.styleFrom(
                        foregroundColor: _primary,
                        side: BorderSide(color: _primary.withOpacity(0.5)),
                        shape: RoundedRectangleBorder(
                          borderRadius: BorderRadius.circular(12),
                        ),
                      ),
                      child: const Text('Ir al inicio'),
                    ),
                  ),
                ] else
                  Text(
                    _paso1Ok
                        ? 'Siguiente: tocá el paso 2 y elegí tu zona de trabajo.'
                        : 'Empezá por el paso 1: al menos un oficio.',
                    style: TextStyle(
                      fontSize: 13,
                      color: Colors.grey.shade600,
                      height: 1.35,
                    ),
                  ),''',
                  1,
              )
          if rt != orig:
              r.write_text(rt, encoding='utf-8')
              print('registro updated')
          else:
              print('registro unchanged')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add lib/elige_oficio.dart lib/registroTrabajador.dart
          if git diff --cached --quiet; then echo No changes; else
            git pull --rebase origin main || true
            git commit -m "etapa5.1: fix Sliver typo + hub onboarding copy/CTAs"
            git push
          fi
          # self-delete workflow
          git rm -f .github/workflows/fix-elige-typo.yml || true
          if ! git diff --cached --quiet; then
            git commit -m "chore: remove fix-elige-typo workflow"
            git push || true
          fi
