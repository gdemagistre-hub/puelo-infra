name: restore-homepage-once
on:
  workflow_dispatch:
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore Homepage and patch copy
        run: |
          git checkout bea5fda618225d04c2bf6e5acf9021ef664e439b -- lib/Homepage.dart
          python3 <<'PY'
          from pathlib import Path
          p = Path('lib/Homepage.dart')
          t = p.read_text()
          assert 'class HomePageWidget' in t, 'Homepage incompleto'
          assert len(t) > 50000, len(t)
          t = t.replace('Prestadores con más confianza', 'Prestadores cerca tuyo')
          t = t.replace('Ordenados por zona y calificación', 'Ordenados por calificación')
          old = """                            Text('Prestadores cerca tuyo', style: TextStyle(color: Colors.white, fontSize: 17, fontWeight: FontWeight.w800)),\n                            SizedBox(height: 6),\n                            Text('Ordenados por calificación', style: TextStyle(color: Colors.white70, fontSize: 13)),\n                          ],\n                        ),\n                      ),\n                      Icon(Icons.verified_user_rounded, color: Colors.white, size: 34),"""
          new = old.replace('Icons.verified_user_rounded', 'Icons.near_me_rounded')
          if old in t:
              t = t.replace(old, new, 1)
          p.write_text(t)
          print('bytes', len(t.encode()))
          assert 'Prestadores cerca tuyo' in t
          assert 'SEE_FILE' not in t
          assert 'PLACEHOLDER' not in t
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/Homepage.dart
          git diff --cached --stat
          git commit -m "Home cliente: Prestadores cerca tuyo (restore archivo completo)."
          git push origin HEAD:main
