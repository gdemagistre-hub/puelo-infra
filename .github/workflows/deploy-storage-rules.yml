name: Deploy Storage rules

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "storage.rules"
      - ".github/workflows/deploy-storage-rules.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
      - name: Install Firebase CLI
        run: npm install -g firebase-tools
      - name: Auth
        env:
          SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_LIFEWALLETPUELO }}
        run: |
          echo "$SA_JSON" > "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"
      - name: Deploy storage rules
        run: |
          firebase deploy --only storage --project lifewalletpuelo --non-interactive
        continue-on-error: true
      - name: Note
        if: always()
        run: |
          echo "Si falla por permisos serviceusage/Storage API, desplegar storage.rules desde un admin con:" >> "$GITHUB_STEP_SUMMARY"
          echo "\`firebase deploy --only storage --project lifewalletpuelo\`" >> "$GITHUB_STEP_SUMMARY"
