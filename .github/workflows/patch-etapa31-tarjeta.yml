name: Patch etapa3.1 tarjeta auth gate
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/patch-etapa31-tarjeta.yml"
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Patch _emitirRecibo auth gate
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path("lib/tarjetaDigital.dart")
          t = p.read_text(encoding="utf-8")
          old = """  void _emitirRecibo(String contraparteUid, String nombreMostrar) {
    final my = UserSession().uid;
    if (my == null || my.isEmpty) {
      _alerta('Entrá con Google (no el menú de prueba) para registrar un pago');
      return;
    }"""
          new = """  void _emitirRecibo(String contraparteUid, String nombreMostrar) {
    final my = UserSession().uid;
    if (my == null || my.isEmpty || !UserSession().hasRealAuth) {
      _alerta('Entrá con Google o Email para registrar un pago');
      return;
    }"""
          if old not in t:
              if "hasRealAuth" in t and "Entrá con Google o Email para registrar un pago" in t:
                  print("ALREADY_PATCHED")
              else:
                  raise SystemExit("pattern not found")
          else:
              p.write_text(t.replace(old, new, 1), encoding="utf-8")
              print("PATCHED")
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add lib/tarjetaDigital.dart
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git pull --rebase origin main || true
            git commit -m "etapa3.1: tarjeta Doy un pago exige Auth real"
            git push
          fi
