name: Patch foto login
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply session + Homepage foto fallbacks
        run: |
          python3 scripts/patch_foto_login.py
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add lib/user_session.dart lib/Homepage.dart
          git commit -m "fix(ui): foto Google en restore y avatar Home" || echo no-changes
          git push
