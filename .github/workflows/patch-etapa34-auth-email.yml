name: Patch etapa3.4 wire auth email
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/patch-etapa34-auth-email.yml"
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Wire index.js + auth_service
        run: |
          python3 <<'PY'
          from pathlib import Path

          # --- index.js export ---
          idx = Path("functions/index.js")
          t = idx.read_text(encoding="utf-8")
          marker = '// Auth emails (no-reply@puelo.app via Resend)'
          if marker not in t:
              block = """
// ---------------------------------------------------------------------------
// Auth emails (no-reply@puelo.app via Resend)
// ---------------------------------------------------------------------------
const authEmails = require("./auth_emails");
exports.sendAuthEmail = authEmails.sendAuthEmail;
"""
              t = t.rstrip() + "\n" + block
              idx.write_text(t, encoding="utf-8")
              print("index.js: wired sendAuthEmail")
          else:
              print("index.js: already wired")

          # --- auth_service.dart ---
          p = Path("lib/auth_service.dart")
          auth = p.read_text(encoding="utf-8")
          if "_sendAuthEmailCf" in auth:
              print("auth_service: already patched")
          else:
              if "cloud_functions" not in auth:
                  auth = auth.replace(
                      "import 'package:cloud_firestore/cloud_firestore.dart';\nimport 'package:firebase_auth/firebase_auth.dart';",
                      "import 'package:cloud_firestore/cloud_firestore.dart';\nimport 'package:cloud_functions/cloud_functions.dart';\nimport 'package:firebase_auth/firebase_auth.dart';",
                      1,
                  )
              auth = auth.replace(
                  """  final FirebaseAuth _auth = FirebaseAuth.instance;\n  final FirebaseFirestore _db = FirebaseFirestore.instance;\n\n  User? get currentUser => _auth.currentUser;""",
                  """  final FirebaseAuth _auth = FirebaseAuth.instance;\n  final FirebaseFirestore _db = FirebaseFirestore.instance;\n\n  static const String _fnRegion = 'us-east1';\n\n  /// CF sendAuthEmail (Resend / no-reply@puelo.app). Fallback = Firebase default.\n  Future<bool> _sendAuthEmailCf({\n    required String type,\n    String? email,\n  }) async {\n    try {\n      final callable = FirebaseFunctions.instanceFor(region: _fnRegion)\n          .httpsCallable('sendAuthEmail');\n      await callable.call(<String, dynamic>{\n        'type': type,\n        if (email != null && email.trim().isNotEmpty) 'email': email.trim().toLowerCase(),\n      });\n      return true;\n    } catch (e) {\n      debugPrint('AuthService._sendAuthEmailCf ($type): $e');\n      return false;\n    }\n  }\n\n  User? get currentUser => _auth.currentUser;""",
                  1,
              )
              old_reg = """      await user.sendEmailVerification(\n        ActionCodeSettings(\n          url: 'https://lifewalletpuelo.web.app/',\n          handleCodeInApp: false,\n        ),\n      );"""
              new_reg = """      // Preferir mail desde no-reply@puelo.app (CF + Resend); fallback Firebase.\n      final sentCf = await _sendAuthEmailCf(type: 'verify');\n      if (!sentCf) {\n        await user.sendEmailVerification(\n          ActionCodeSettings(\n            url: 'https://lifewalletpuelo.web.app/',\n            handleCodeInApp: false,\n          ),\n        );\n      }"""
              if old_reg not in auth:
                  raise SystemExit("register block missing")
              auth = auth.replace(old_reg, new_reg, 1)

              # resend - only first remaining bare sendEmailVerification after register patch
              old_resend = """    try {\n      await user.sendEmailVerification(\n        ActionCodeSettings(\n          url: 'https://lifewalletpuelo.web.app/',\n          handleCodeInApp: false,\n        ),\n      );\n    } on FirebaseAuthException catch (e) {\n      throw AuthValidationException(humanizeAuthError(e));\n    }\n  }\n\n  Future<void> sendPasswordReset(String email) async {"""
              new_resend = """    try {\n      final sentCf = await _sendAuthEmailCf(type: 'verify');\n      if (!sentCf) {\n        await user.sendEmailVerification(\n          ActionCodeSettings(\n            url: 'https://lifewalletpuelo.web.app/',\n            handleCodeInApp: false,\n          ),\n        );\n      }\n    } on FirebaseAuthException catch (e) {\n      throw AuthValidationException(humanizeAuthError(e));\n    }\n  }\n\n  Future<void> sendPasswordReset(String email) async {"""
              if old_resend not in auth:
                  raise SystemExit("resend block missing")
              auth = auth.replace(old_resend, new_resend, 1)

              old_reset = """    try {\n      await _auth.sendPasswordResetEmail(\n        email: e,\n        actionCodeSettings: ActionCodeSettings(\n          url: 'https://lifewalletpuelo.web.app/',\n          handleCodeInApp: false,\n        ),\n      );\n    } on FirebaseAuthException catch (ex) {"""
              new_reset = """    try {\n      final sentCf = await _sendAuthEmailCf(type: 'reset', email: e);\n      if (!sentCf) {\n        await _auth.sendPasswordResetEmail(\n          email: e,\n          actionCodeSettings: ActionCodeSettings(\n            url: 'https://lifewalletpuelo.web.app/',\n            handleCodeInApp: false,\n          ),\n        );\n      }\n    } on FirebaseAuthException catch (ex) {"""
              if old_reset not in auth:
                  raise SystemExit("reset block missing")
              auth = auth.replace(old_reset, new_reset, 1)

              auth = auth.replace(
                  """/// Flujo email:\n/// 1) registerWithEmail → crea user + manda mail de verificación\n/// 2) Usuario valida el link del mail\n/// 3) signInWithEmail exige emailVerified → ensureUserProfile + UserSession""",
                  """/// Flujo email:\n/// 1) registerWithEmail → crea user + mail vía CF (no-reply@puelo.app / Resend)\n/// 2) Usuario valida el link del mail\n/// 3) signInWithEmail exige emailVerified → ensureUserProfile + UserSession\n/// Fallback: si falta RESEND_API_KEY, Firebase Auth envía el mail default.""",
                  1,
              )
              p.write_text(auth, encoding="utf-8")
              print("auth_service: patched")
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add functions/index.js lib/auth_service.dart
          if git diff --cached --quiet; then echo No changes; else
            git pull --rebase origin main || true
            git commit -m "etapa3.4: wire sendAuthEmail + AuthService CF/fallback"
            git push
          fi
