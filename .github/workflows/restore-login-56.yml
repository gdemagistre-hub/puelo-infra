name: restore-login-56
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/restore-login-56.yml'
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore login and patch landing
        run: |
          set -e
          git checkout 759b123445659924c49cc4f937fc74f3ed92524b -- lib/loginScreen.dart
          python3 <<'PY'
          from pathlib import Path
          p = Path('lib/loginScreen.dart')
          t = p.read_text()
          old = """    Navigator.pushReplacement(\n      context,\n      MaterialPageRoute(builder: (context) => const HomePageWidget()),\n    );"""
          new = """    Navigator.pushReplacement(\n      context,\n      MaterialPageRoute(\n        builder: (context) => HomePageWidget(\n          initialModoPrestador: UserSession().preferredHomeModoPrestador,\n        ),\n      ),\n    );"""
          if old not in t:
              raise SystemExit('login pattern missing')
          p.write_text(t.replace(old, new, 1))
          print('login patched', p.stat().st_size)
          PY
          rm -f .github/workflows/restore-login-56.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/loginScreen.dart .github/workflows/restore-login-56.yml
          git commit -m "fix(auth): restore loginScreen + 5.6 Home prestador landing"
          git push
