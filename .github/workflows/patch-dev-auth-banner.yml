name: Patch Homepage DevAuthBanner

on:
  workflow_dispatch:
  push:
    paths:
      - "lib/widgets/dev_auth_banner.dart"
      - ".github/workflows/patch-dev-auth-banner.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Inject banner into Homepage
        run: |
          set -e
          FILE=lib/Homepage.dart
          if grep -q "DevAuthBanner" "$FILE"; then
            echo "Already patched"
            exit 0
          fi
          python3 << 'PY'
          from pathlib import Path
          import re
          p = Path("lib/Homepage.dart")
          t = p.read_text()
          if "DevAuthBanner" in t:
              print("already has banner")
              raise SystemExit(0)

          # 1) Import
          if "dev_auth_banner.dart" not in t:
              if "import 'onboarding/home_tour_overlay.dart';" in t:
                  t = t.replace(
                      "import 'onboarding/home_tour_overlay.dart';",
                      "import 'onboarding/home_tour_overlay.dart';\nimport 'widgets/dev_auth_banner.dart';",
                      1,
                  )
              else:
                  # after first import line
                  t = re.sub(r"(import .+;\n)", r"\1import 'widgets/dev_auth_banner.dart';\n", t, count=1)

          # 2) Insert as first child of the main body Stack (right after children: [)
          #    Safer than matching deep Positioned.fill blocks.
          m = re.search(
              r"(body:\s*Stack\s*\(\s*fit:\s*StackFit\.expand,\s*children:\s*\[)",
              t,
          )
          if not m:
              # broader
              m = re.search(r"(body:\s*Stack\([\s\S]{0,120}?children:\s*\[)", t)
          if not m:
              raise SystemExit("body Stack children pattern not found in Homepage.dart")

          insert_at = m.end()
          banner_line = "\n          const DevAuthBanner(),"
          t = t[:insert_at] + banner_line + t[insert_at:]
          p.write_text(t)
          print("patched")
          PY
          if ! grep -q "DevAuthBanner" "$FILE"; then
            echo "Patch failed"
            exit 1
          fi
          echo "--- snippet ---"
          grep -n "DevAuthBanner\|dev_auth_banner" "$FILE" || true
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add lib/Homepage.dart
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "Etapa 0: Homepage muestra DevAuthBanner si needsRealAuth"
            git push
          fi
