name: Patch Homepage DevAuthBanner

on:
  workflow_dispatch:
  push:
    paths:
      - "lib/widgets/dev_auth_banner.dart"
      - ".github/workflows/patch-dev-auth-banner.yml"

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject banner into Homepage
        run: |
          set -e
          FILE=lib/Homepage.dart
          if grep -q "DevAuthBanner" "$FILE"; then
            echo "Already patched"
            exit 0
          fi
          # Import
          if ! grep -q "dev_auth_banner.dart" "$FILE"; then
            if grep -q "home_tour_overlay.dart" "$FILE"; then
              sed -i "s|import 'onboarding/home_tour_overlay.dart';|import 'onboarding/home_tour_overlay.dart';\nimport 'widgets/dev_auth_banner.dart';|" "$FILE"
            else
              # fallback: after last import of package/local
              sed -i "0,/^import /s|^import |import 'widgets/dev_auth_banner.dart';\nimport |" "$FILE" || true
              if ! grep -q "dev_auth_banner.dart" "$FILE"; then
                echo "Could not add import"
                exit 1
              fi
            fi
          fi
          python3 << 'PY'
          from pathlib import Path
          import re
          p = Path("lib/Homepage.dart")
          t = p.read_text()
          if "DevAuthBanner" in t:
              print("already has banner")
              raise SystemExit(0)

          # Flexible: insert const DevAuthBanner() as Stack sibling right before
          # the Positioned that builds the bottom nav (last nav bar).
          # Match the closing of Positioned.fill(..._buildAnimatedTabBody...) then
          # the following Positioned( ... _buildBottomNav() ...)
          pattern = re.compile(
              r"(Positioned\.fill\s*\(\s*child:\s*Padding\s*\(\s*"
              r"padding:\s*EdgeInsets\.only\(bottom:\s*contentBottomPad\),\s*"
              r"child:\s*_buildAnimatedTabBody\(\),\s*\),\s*\),\s*)"
              r"(Positioned\s*\(\s*left:\s*0,\s*right:\s*0,\s*bottom:\s*0,\s*"
              r"child:\s*_buildBottomNav\(\),\s*\),)",
              re.DOTALL,
          )
          m = pattern.search(t)
          if not m:
              # Broader fallback: any Positioned.fill with _buildAnimatedTabBody followed by Positioned with _buildBottomNav
              pattern2 = re.compile(
                  r"(Positioned\.fill\([\s\S]*?_buildAnimatedTabBody\(\)[\s\S]*?\),\s*)"
                  r"(Positioned\([\s\S]*?_buildBottomNav\(\)[\s\S]*?\),)",
                  re.DOTALL,
              )
              m = pattern2.search(t)
          if not m:
              raise SystemExit("Stack pattern not found in Homepage.dart")

          insert = m.group(1) + "          const DevAuthBanner(),\n          " + m.group(2)
          t2 = t[: m.start()] + insert + t[m.end():]
          p.write_text(t2)
          print("patched")
          PY
          if ! grep -q "DevAuthBanner" "$FILE"; then
            echo "Patch failed"
            exit 1
          fi
          echo "--- snippet ---"
          grep -n "DevAuthBanner\|dev_auth_banner" "$FILE" || true
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add lib/Homepage.dart
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "Etapa 0: Homepage muestra DevAuthBanner si needsRealAuth"
            git push
          fi
