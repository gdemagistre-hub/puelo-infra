name: Deploy Firestore rules

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "firestore.rules"
      - "scripts/deploy_rules_rest.js"
      - ".github/workflows/deploy-rules-rest.yml"

permissions: {}

concurrency:
  group: firestore-production-deploy
  cancel-in-progress: false

jobs:
  deploy-rules:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Solo main
        run: test "${GITHUB_REF}" = "refs/heads/main"

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Deploy firestore rules
        uses: w9jds/firebase-action@5b73b1274a2229c7598af09e6e95addfb75f897b # master / tools v15.28.1
        with:
          args: deploy --only firestore:rules --project lifewalletpuelo
        env:
          GCP_SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_LIFEWALLETPUELO }}
