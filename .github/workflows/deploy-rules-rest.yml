name: Deploy Firestore rules

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "firestore.rules"
      - "scripts/deploy_rules_rest.js"
      - ".github/workflows/deploy-rules-rest.yml"

jobs:
  deploy-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Service account
        env:
          SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_LIFEWALLETPUELO }}
        run: |
          echo "$SA_JSON" > "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"
          echo "GCLOUD_PROJECT=lifewalletpuelo" >> "$GITHUB_ENV"
          echo "GOOGLE_CLOUD_PROJECT=lifewalletpuelo" >> "$GITHUB_ENV"

      - name: Install firebase-tools
        run: npm install -g firebase-tools@13

      - name: Deploy firestore rules
        run: firebase deploy --only firestore:rules --project lifewalletpuelo --non-interactive
