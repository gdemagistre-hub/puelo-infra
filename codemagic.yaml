workflows:
  ios-testflight:
    name: iOS TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: Codemagic PROX
    environment:
      groups:
        - ios_firebase
      flutter: stable
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: app.puelo
    scripts:
      - name: Prebuild iOS module
        script: |
          #!/usr/bin/env bash
          set -euo pipefail
          bash tools/codemagic_prebuild_ios.sh
      - name: Init keychain
        script: |
          keychain initialize
      - name: Fetch or create App Store signing files
        script: |
          #!/usr/bin/env bash
          set -euo pipefail
          KEY=/tmp/ios_dist_key.pem
          if [ -n "${CERTIFICATE_PRIVATE_KEY:-}" ]; then
            printf '%s\n' "$CERTIFICATE_PRIVATE_KEY" > "$KEY"
          else
            openssl genrsa -out "$KEY" 2048
          fi
          chmod 600 "$KEY"
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create \
            --certificate-key=@file:"$KEY"
      - name: Add certificates to keychain
        script: |
          keychain add-certificates
      - name: Apply signing to Xcode project
        script: |
          xcode-project use-profiles
      - name: Flutter pub get
        script: |
          flutter config --no-enable-swift-package-manager
          flutter pub get
      - name: Check Firebase env
        script: |
          #!/usr/bin/env bash
          if [ -z "${FIREBASE_API_KEY_IOS:-}" ] || [ -z "${FIREBASE_APP_ID_IOS:-}" ]; then
            echo "El grupo ios_firebase no llegó al job."
            env | awk -F= '/FIREBASE|GOOGLESERVICE|CERTIFICATE_PRIVATE|GOOGLE_WEB/ {print $1}' || true
            exit 1
          fi
          echo "Firebase iOS env OK"
      - name: Build IPA
        script: |
          #!/usr/bin/env bash
          set -euo pipefail
          flutter config --no-enable-swift-package-manager
          flutter build ipa --release \
            --export-options-plist=/Users/builder/export_options.plist \
            --dart-define=FIREBASE_API_KEY_IOS="$FIREBASE_API_KEY_IOS" \
            --dart-define=FIREBASE_APP_ID_IOS="$FIREBASE_APP_ID_IOS" \
            --dart-define=GOOGLE_WEB_CLIENT_ID="${GOOGLE_WEB_CLIENT_ID:-}"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
        submit_to_app_store: false
